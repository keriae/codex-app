name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Codex schema verifier
        run: npm install --global @openai/codex@0.164.0
      - name: Verify integration schemas
        run: |
          npm run verify:integrations-schema
          node scripts/verify-marketplace-schema.mjs
      - name: Verify promo lockfile
        run: npm ci --prefix promo --ignore-scripts
